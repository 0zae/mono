<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Mono</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mono">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  color-scheme:light;
  --home:#FFFFFF;
  --bg:#F2F2F7; --cell:#FFFFFF; --fill:rgba(118,118,128,.12); --sep:rgba(60,60,67,.18);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --accent:#FF5A2E; --red:#E0245E; --green:#34C759; --orange:#FF9500;
  --dim:rgba(30,30,34,.1); --glass:rgba(255,255,255,.9); --pop:rgba(255,255,255,.96); --chev:rgba(60,60,67,.45); --card-edge:rgba(0,0,0,.07); --glass-edge:rgba(255,255,255,.6);
  --k-lemon:#F7CF1F; --k-amber:#FFA41B; --k-cherry:#E8243F; --k-rose:#FF4FA8; --k-violet:#B43CF0; --k-iris:#6E4BFF;
  --k-royal:#2F6BFF; --k-sky:#1FB5F2; --k-aqua:#14C7B4; --k-emerald:#2DD177; --k-lime:#9AE02B; --k-teal:#30B0C7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --home:#000000;
    --bg:#000000; --cell:#1C1C1E; --fill:rgba(118,118,128,.24); --sep:rgba(84,84,88,.6);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --accent:#FF5A2E; --red:#FF4F7B; --green:#30D158; --orange:#FF9F0A; --dim:rgba(0,0,0,.45); --glass:rgba(30,30,32,.7); --pop:rgba(44,44,46,.92); --chev:rgba(235,235,245,.5); --card-edge:rgba(255,255,255,.04); --glass-edge:rgba(255,255,255,.08);
    --k-lemon:#F7CF1F; --k-amber:#FFA41B; --k-cherry:#E8243F; --k-rose:#FF4FA8; --k-violet:#B43CF0; --k-iris:#6E4BFF;
    --k-royal:#2F6BFF; --k-sky:#1FB5F2; --k-aqua:#14C7B4; --k-emerald:#2DD177; --k-lime:#9AE02B; --k-teal:#40C8E0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --home:#000000;
  --bg:#000000; --cell:#1C1C1E; --fill:rgba(118,118,128,.24); --sep:rgba(84,84,88,.6);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --accent:#FF5A2E; --red:#FF4F7B; --green:#30D158; --orange:#FF9F0A; --dim:rgba(0,0,0,.45); --glass:rgba(30,30,32,.7); --pop:rgba(44,44,46,.92); --chev:rgba(235,235,245,.5); --card-edge:rgba(255,255,255,.04); --glass-edge:rgba(255,255,255,.08);
  --k-lemon:#F7CF1F; --k-amber:#FFA41B; --k-cherry:#E8243F; --k-rose:#FF4FA8; --k-violet:#B43CF0; --k-iris:#6E4BFF;
  --k-royal:#2F6BFF; --k-sky:#1FB5F2; --k-aqua:#14C7B4; --k-emerald:#2DD177; --k-lime:#9AE02B; --k-teal:#40C8E0;
}
*{box-sizing:border-box}

body{margin:0}
[hidden]{display:none!important}
.ai{font-size:12px;color:var(--label3);text-align:center;padding-bottom:10px;min-height:1.6em}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--home);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;font-size:17px;line-height:1.3;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- home: one field ---------- */
.home{position:fixed;top:0;left:0;right:0;height:var(--homeH,100%);padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;padding-inline:16px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:560px;margin:0 auto;padding-bottom:calc(var(--homeH,100vh) * .34)}
.field{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;height:48px;padding:0 12px}
.field > svg{flex:none;color:var(--label2)}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;height:100%}
.field input::placeholder{color:var(--label2)}
.field .go{border:0;background:var(--accent);color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;transition:opacity .15s,transform .15s}
.field .go[hidden]{display:none}
.field .cam{flex:none;width:34px;height:34px;margin-right:-6px;display:grid;place-items:center;color:var(--label2);border-radius:50%;cursor:pointer}
.field .cam:active{background:var(--fill)}
.field .cam[hidden]{display:none}
.field .cam.busy{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
/* 이번 달 사용 금액이 늘어날 때 */
.foot b{display:inline-block;transition:color .4s}
.foot b.bump{color:var(--accent);animation:bump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.14)}100%{transform:scale(1)}}
.under{min-height:44px;padding:10px 4px 0;font-size:15px;color:var(--label2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.under .amt{color:var(--label);font-weight:600}
.under .amt.in{color:var(--green)}
.under .tag{display:inline-flex;align-items:center;gap:6px}
.under .dot{width:8px;height:8px;border-radius:50%}
.under .sep{color:var(--label3)}
.under button{border:0;background:none;color:var(--accent);padding:0;font-size:15px}
.done{color:var(--label2)}
.done b{color:var(--label);font-weight:600}

.logo{max-width:560px;width:100%;margin:0 auto;padding-top:14px;display:flex;will-change:transform}
.logo img{display:block;height:29px;width:auto}
.foot{position:fixed;left:0;right:0;bottom:var(--kb,0px);padding-bottom:calc(20px + var(--sab,env(safe-area-inset-bottom,0px)));display:flex;justify-content:center;background:var(--home);transition:bottom .25s ease}
.kb-open .foot{padding-bottom:6px}
.foot button{border:0;background:none;color:var(--label2);font-size:15px;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:6px}
.foot button:hover{color:var(--label);background:var(--fill)}
.foot b{color:var(--label);font-weight:600}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--dim);-webkit-backdrop-filter:blur(14px) saturate(120%);backdrop-filter:blur(14px) saturate(120%);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 14px + 29px + 14px);background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 .5px 0 var(--glass-edge),0 -8px 30px rgba(0,0,0,.08);border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .42s cubic-bezier(.32,.72,0,1);will-change:transform;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;flex:none;touch-action:none}
.grab{position:absolute;top:0;left:50%;width:120px;height:22px;transform:translateX(-50%);touch-action:none;cursor:grab;z-index:1}
.grab::after{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;border-radius:3px;background:var(--label3);transform:translateX(-50%)}
.bar button{border:0;background:none;color:var(--accent);font-size:17px;padding:6px 0}
.bar .b{font-weight:600}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.title-row h1{margin:0}
.mnav{display:flex;gap:10px}
.mnav button{width:34px;height:34px;padding:0;border:0;border-radius:50%;background:var(--fill);color:var(--accent);display:grid;place-items:center}
.mnav button:active{opacity:.6}
.mnav button:disabled{color:var(--label3);cursor:default}
.mnav svg{display:block}
.bar .back{display:flex;align-items:center;gap:4px}
.scroll{overflow-y:auto;flex:1;padding:0 16px calc(32px + var(--kb,0px) + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
h1{font-size:34px;font-weight:700;letter-spacing:.01em;margin:4px 0 14px}
.sum{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
.sum .k{font-size:13px;color:var(--label2)}
.sum .v{font-size:28px;font-weight:700;letter-spacing:-.01em}
.meter{height:6px;border-radius:3px;background:var(--fill);margin:12px 0 8px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.meter i.over{background:var(--red)}
.sum .row{display:flex;justify-content:space-between;font-size:13px;color:var(--label2)}
.sum .row b{color:var(--label);font-weight:600}
.cap{font-size:13px;color:var(--label2);text-transform:none;padding:0 16px 7px;display:flex;justify-content:space-between}
.group{background:var(--cell);border-radius:10px;overflow:hidden;margin-bottom:24px}
.sheet .group{box-shadow:0 0 0 .5px var(--card-edge)}
.cell{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:44px;width:100%;border:0;background:none;text-align:left;position:relative}
button.cell:active{background:var(--fill)}
.cell + .cell::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.cell:has(> .ico)::before,.cell:has(> .ptile)::before{left:58px}
.ptile{width:30px;height:30px;border-radius:8px;background:var(--fill);color:var(--label2);display:grid;place-items:center;flex:none}
.ptile.def{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.pi{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.as .kinds{display:flex;gap:6px;padding:0 14px 12px}
.as .kinds button{flex:1;min-width:0;height:40px;border:0;border-radius:10px;background:var(--fill);color:var(--label2);display:grid;place-items:center}
.as .kinds button .pi{width:20px;height:20px}
.as .kinds button.sel{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cell:has(> .cdot)::before{left:38px}
.cdot{width:10px;height:10px;border-radius:50%;flex:none}
.chv{flex:none;color:var(--chev);vertical-align:middle}
.chv-bg{fill:var(--fill)}
.r .chv{margin-left:2px}
h2.sec{font-size:22px;font-weight:700;letter-spacing:.01em;margin:6px 0 12px}
.ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;flex:none}
.cell .t{flex:1;min-width:0;padding:11px 0;display:flex;flex-direction:column;gap:1px}
.cell .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .t small{font-size:13px;color:var(--label2)}
.cell .r{color:var(--label2);white-space:nowrap}
.cell .r.out{color:var(--label)}
.cell .r.in{color:var(--green)}
.empty{text-align:center;color:var(--label2);font-size:15px;padding:40px 16px}
.edit{border:0;background:none;color:var(--accent);font-size:13px;padding:0}

/* ---------- action sheet ---------- */
/* 가운데 작은 팝업 */
.as{position:fixed;left:50%;top:calc((100% - var(--kb,0px)) / 2);width:min(340px,calc(100% - 40px));max-height:calc(100% - var(--kb,0px) - env(safe-area-inset-top,0px) - 40px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--pop);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-radius:18px;box-shadow:0 0 0 .5px var(--card-edge),0 18px 50px rgba(0,0,0,.16);
  transform:translate(-50%,-50%) scale(.94);opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.3,1.3,.5,1),opacity .18s,top .25s;z-index:3}
.as.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.as .g{background:none}
.as .h{text-align:center;font-size:15px;font-weight:600;color:var(--label);padding:18px 18px 12px;line-height:1.35}
.as .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;justify-content:center}
.as .chips button{border:0;background:var(--fill);border-radius:999px;padding:6px 11px;font-size:14px;display:flex;align-items:center;gap:6px}
.as .chips button.sel{background:var(--accent);color:#fff}
.as .chips i{width:7px;height:7px;border-radius:50%}
.as .sub{font-size:12px;color:var(--label2);padding:2px 16px 6px;text-align:center}
.as .fields{display:flex;flex-direction:column;gap:8px;padding:0 14px 12px}
.as .swatches{display:grid;grid-template-columns:repeat(6,30px);gap:12px 14px;justify-content:center;padding:4px 14px 16px}
.as .swatches button,.as .swatches label{width:30px;height:30px;border-radius:50%;border:0;padding:0;box-shadow:0 0 0 2px var(--pop);cursor:pointer;position:relative}
.as .swatches .sel{box-shadow:0 0 0 2px var(--pop),0 0 0 3.5px var(--label)}
.as .swatches label{background:conic-gradient(#f33,#ff3,#3f3,#3ff,#33f,#f3f,#f33)}
.as .swatches label i{position:absolute;inset:7px;border-radius:50%;background:var(--pop)}
.as .swatches label input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.as .fields textarea{border:0;background:var(--fill);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;outline:none;width:100%;min-height:68px;resize:vertical;color:inherit}
.as .day-row{display:flex;align-items:center;gap:8px;font-size:16px;padding:0 4px}
.as .fields .day-row input{width:64px;text-align:center}
.as .hint-line{font-size:12px;color:var(--label2);text-align:center;padding:0 16px 10px;min-height:1px}
/* 부가 동작(기본 지정·삭제 등): 작은 글자 버튼 */
.as .pop-extra{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px;padding:0 16px 12px}
.as .pop-extra button{border:0;background:none;padding:4px 0;font-size:14px;color:var(--label2)}
.as .pop-extra button.red{color:var(--red)}
/* 아래: 취소 | 저장 */
.as .pop-foot{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:.5px solid var(--sep)}
.as .pop-foot button{border:0;background:none;height:48px;font-size:17px;color:var(--label2)}
.as .pop-foot button + button{border-left:.5px solid var(--sep)}
.as .pop-foot .primary{color:var(--accent);font-weight:600}
.as .pop-foot .primary.red{color:var(--red)}
.as .fields input{border:0;background:var(--fill);border-radius:10px;height:42px;padding:0 12px;font-size:16px;outline:none;width:100%}
.bar .right{display:flex;gap:18px}
.inline{border:0;background:none;outline:none;font-size:17px;width:100%;padding:0}
.chev svg{transition:transform .2s}
.chev.open svg{transform:rotate(90deg)}
.toggle .t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot-note a{color:var(--accent);text-decoration:none}
.foot-note{font-size:13px;color:var(--label2);padding:0 16px;margin:-16px 0 24px;line-height:1.4}
.scrim2{z-index:2}

.budget-in{width:100%;border:0;background:var(--fill);border-radius:10px;height:44px;padding:0 12px;font-size:17px;outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="home">
  <header class="logo"><img src="./logo.svg" alt="Mono"></header>
  <div class="center">
    <div class="ai" id="ai"></div>
    <form class="field" id="form" autocomplete="off">
      <svg width="17" height="17" viewBox="0 0 17 17" aria-hidden="true"><circle cx="7.2" cy="7.2" r="5.7" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M11.4 11.4 15.6 15.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      <input id="q" type="text" enterkeyhint="done" aria-label="언제, 어디에, 얼마를 썼는지 입력" placeholder="어제 스타벅스 5,800원">
      <label class="cam" id="cam" for="camFile" aria-label="영수증 찍기" role="button"><svg width="22" height="18" viewBox="0 0 22 18" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M7.4 1.6 8.6.4Q9 0 9.6 0h2.8q.6 0 1 .4l1.2 1.2h3.9a3 3 0 0 1 3 3V15a3 3 0 0 1-3 3h-15a3 3 0 0 1-3-3V4.6a3 3 0 0 1 3-3zM15.4 9.8a4.4 4.4 0 1 0-8.8 0 4.4 4.4 0 1 0 8.8 0zM14 9.8a3 3 0 1 0-6 0 3 3 0 1 0 6 0z"/></svg></label>
      <input type="file" id="camFile" accept="image/*" hidden>
      <button class="go" id="go" type="submit" aria-label="기록" hidden><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 12V2M2.5 6.5 7 2l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
    <div class="under" id="under" aria-live="polite"></div>
  </div>
  <div class="foot"><button id="open" type="button"></button></div>
</main>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="이번 달 내역">
  <div class="grab"></div>
  <div class="bar">
    <button id="gear">설정</button>
    <button id="back" class="back" hidden><svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>내역</button>
    <button class="b" id="close">완료</button>
  </div>
  <div class="scroll" id="scroll"></div>
</section>

<div class="scrim scrim2" id="scrim2"></div>
<div class="as" id="as" role="dialog" aria-modal="true"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
