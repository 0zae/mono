<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Mono</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mono">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  color-scheme:light;
  --home:#FFFFFF;
  --bg:#F2F2F7; --cell:#FFFFFF; --fill:rgba(118,118,128,.12); --sep:rgba(60,60,67,.18);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --accent:#FF5A2E; --red:#E0245E; --green:#34C759; --orange:#FF9500;
  --dim:rgba(30,30,34,.1); --glass:rgba(255,255,255,.9); --sheet-solid:#FCFCFC; --pop:rgba(255,255,255,.96); --chev:rgba(60,60,67,.45); --chev-line:rgba(60,60,67,.3); --card-edge:rgba(0,0,0,.07); --glass-edge:rgba(255,255,255,.6);
  --k-lemon:#F7CF1F; --k-amber:#FFA41B; --k-cherry:#E8243F; --k-rose:#FF4FA8; --k-violet:#B43CF0; --k-iris:#6E4BFF;
  --k-royal:#2F6BFF; --k-sky:#1FB5F2; --k-aqua:#14C7B4; --k-emerald:#2DD177; --k-lime:#9AE02B; --k-teal:#30B0C7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --home:#000000;
    --bg:#000000; --cell:#1C1C1E; --fill:rgba(118,118,128,.24); --sep:rgba(84,84,88,.6);
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --accent:#FF5A2E; --red:#FF4F7B; --green:#30D158; --orange:#FF9F0A; --dim:rgba(0,0,0,.45); --glass:rgba(30,30,32,.7); --sheet-solid:#18181A; --pop:rgba(44,44,46,.92); --chev:rgba(235,235,245,.5); --chev-line:rgba(235,235,245,.3); --card-edge:rgba(255,255,255,.04); --glass-edge:rgba(255,255,255,.08);
    --k-lemon:#F7CF1F; --k-amber:#FFA41B; --k-cherry:#E8243F; --k-rose:#FF4FA8; --k-violet:#B43CF0; --k-iris:#6E4BFF;
    --k-royal:#2F6BFF; --k-sky:#1FB5F2; --k-aqua:#14C7B4; --k-emerald:#2DD177; --k-lime:#9AE02B; --k-teal:#40C8E0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --home:#000000;
  --bg:#000000; --cell:#1C1C1E; --fill:rgba(118,118,128,.24); --sep:rgba(84,84,88,.6);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --accent:#FF5A2E; --red:#FF4F7B; --green:#30D158; --orange:#FF9F0A; --dim:rgba(0,0,0,.45); --glass:rgba(30,30,32,.7); --sheet-solid:#18181A; --pop:rgba(44,44,46,.92); --chev:rgba(235,235,245,.5); --chev-line:rgba(235,235,245,.3); --card-edge:rgba(255,255,255,.04); --glass-edge:rgba(255,255,255,.08);
  --k-lemon:#F7CF1F; --k-amber:#FFA41B; --k-cherry:#E8243F; --k-rose:#FF4FA8; --k-violet:#B43CF0; --k-iris:#6E4BFF;
  --k-royal:#2F6BFF; --k-sky:#1FB5F2; --k-aqua:#14C7B4; --k-emerald:#2DD177; --k-lime:#9AE02B; --k-teal:#40C8E0;
}
*{box-sizing:border-box}

body{margin:0}
[hidden]{display:none!important}
/* Gemini 안내: 검색창 아래, 입력 미리보기가 뜨면 그 자리를 비켜 준다 */
.below{position:relative}
/* 안내와 미리보기는 같은 높이(44px, 위 10px)의 줄에서 가운데 맞춤 → 서로 엇갈려 페이드 */
.ai{position:absolute;left:0;right:0;top:0;height:44px;padding-top:10px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--label3);pointer-events:none;transition:opacity .28s,transform .32s cubic-bezier(.3,.8,.3,1)}
.below:has(.under:not(:empty)) .ai{opacity:0;transform:translateY(-10px)}
/* A: 안내는 위로 빠지고, 미리보기는 아래에서 살짝 올라온다 */
.under.enter{animation:rise .32s cubic-bezier(.3,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--home);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;font-size:17px;line-height:1.3;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- home: one field ---------- */
.home{position:fixed;top:0;left:0;right:0;height:var(--homeH,100%);padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;padding-inline:16px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:560px;margin:0 auto;padding-bottom:calc(var(--homeH,100vh) * .34)}
.field{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:16px;height:48px;padding:0 12px}
.field > svg{flex:none;color:var(--label2)}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;height:100%}
.field input::placeholder{color:var(--label2)}
.field .go{border:0;background:var(--accent);color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;transition:opacity .15s,transform .15s}
.field .go[hidden]{display:none}
.field .cam{flex:none;width:34px;height:34px;margin-right:-6px;display:grid;place-items:center;color:var(--label2);border-radius:50%;cursor:pointer}
.field .cam:active{background:var(--fill)}
.field .cam[hidden]{display:none}
.field .cam.busy{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
/* 이번 달 사용 금액이 늘어날 때 */
.foot b{display:inline-block;transition:color .4s}
.foot b.bump{color:var(--accent);animation:bump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.14)}100%{transform:scale(1)}}
.under{min-height:44px;padding:10px 4px 0;font-size:15px;color:var(--label2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.under .amt{color:var(--label);font-weight:600}
.under .amt.in{color:var(--green)}
.under .tag{display:inline-flex;align-items:center;gap:6px}
.under .dot{width:8px;height:8px;border-radius:50%}
.under .sep{color:var(--label3)}
.under button{border:0;background:none;color:var(--accent);padding:0;font-size:15px}
.done{color:var(--label2)}
.done b{color:var(--label);font-weight:600}

/* 시작 화면 */
.splash{position:fixed;inset:0;background:#FF5A2E;z-index:20}
.splash svg{position:absolute;left:50%;top:50%;width:min(230px,62vw);transform:translate(-50%,-50%);transform-origin:0 0;overflow:visible}
.splash-done .splash{display:none}
.sp-bg{position:absolute;left:0;top:0;width:100%;height:100%;background:#FF5A2E;transform-origin:0 0;will-change:transform}
.splash svg{will-change:transform}
html:not(.splash-done) .logo img{opacity:0}
/* 로고: 검색창 바로 위 가운데 (구글식) */
.logo{display:flex;justify-content:center;margin:0 0 38px}
.logo img{display:block;height:41px;width:auto}
.foot{position:fixed;left:0;right:0;bottom:var(--kb,0px);padding-bottom:calc(20px + var(--sab,env(safe-area-inset-bottom,0px)));display:flex;justify-content:center;background:var(--home);transition:bottom .25s ease}
.kb-open .foot{padding-bottom:6px}
.foot button{border:0;background:none;color:var(--label2);font-size:15px;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:6px}
.foot button:hover{color:var(--label);background:var(--fill)}
.foot b{color:var(--label);font-weight:600}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--dim);-webkit-backdrop-filter:blur(14px) saturate(120%);backdrop-filter:blur(14px) saturate(120%);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 14px + 29px + 14px);background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 .5px 0 var(--glass-edge),0 -8px 30px rgba(0,0,0,.08);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .42s cubic-bezier(.32,.72,0,1);will-change:transform;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet{overflow:hidden}
.scroll.ghost{position:absolute;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none;background:transparent}
.grab{z-index:4}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;flex:none;touch-action:none;position:relative;z-index:3}
.grab{position:absolute;top:0;left:50%;width:120px;height:22px;transform:translateX(-50%);touch-action:none;cursor:grab;z-index:1}
.grab::after{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;border-radius:3px;background:var(--label3);transform:translateX(-50%)}
.bar button{border:0;background:none;color:var(--accent);font-size:17px;padding:6px 0}
.bar button:active{opacity:.5}
.bar .b{font-weight:600}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.title-row h1{margin:0}
.mnav{display:flex;gap:10px}
.mnav button{width:34px;height:34px;padding:0;border:0;border-radius:50%;background:var(--fill);color:var(--accent);display:grid;place-items:center}
.mnav button:active{opacity:.6}
.mnav button:disabled{color:var(--label3);cursor:default}
.mnav svg{display:block}
.bar .back{display:flex;align-items:center;gap:7px}
.scroll{overflow-y:auto;flex:1;padding:0 16px calc(32px + var(--kb,0px) + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em;margin:4px 0 14px}
.sum{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
.sum .k{font-size:13px;line-height:18px;color:var(--label2)}
.sum .v{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.01em}
.meter{height:6px;border-radius:3px;background:var(--fill);margin:12px 0 8px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.meter i.over{background:var(--red)}
.sum .row{display:flex;justify-content:space-between;font-size:13px;line-height:18px;color:var(--label2)}
.sum .row b{color:var(--label);font-weight:600}
.sum .v .of{font-size:15px;font-weight:500;color:var(--label2);letter-spacing:0;margin-left:2px}
.cap{font-size:13px;line-height:18px;color:var(--label2);text-transform:none;padding:0 16px 7px;display:flex;justify-content:space-between}
.group{background:var(--cell);border-radius:16px;overflow:hidden;margin-bottom:24px}
.sheet .group{box-shadow:0 0 0 .5px var(--card-edge)}
.cell{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:44px;line-height:22px;width:100%;border:0;background:none;text-align:left;position:relative}
button.cell:active{background:var(--fill)}
.cell + .cell::before{content:"";position:absolute;top:0;right:0;left:16px;height:1px;background:var(--sep);transform-origin:0 0;transform:scaleY(.5)}
@media (min-resolution:3dppx){.cell + .cell::before{transform:scaleY(.3334)}}
.group:has(.cdot) .cell + .cell::before{left:38px}
.group:has(.ptile) .cell + .cell::before,.group:has(.ico) .cell + .cell::before{left:58px}
/* 항목이 아닌 "○○ 추가" 줄 위의 선은 카드 끝까지 */
.group .cell + .cell[data-m="__new"]::before,.group .cell + .cell[data-rec="__new"]::before,.group .cell + .cell[data-cat="__new"]::before{left:0}
.ptile{width:30px;height:30px;border-radius:9px;background:var(--fill);color:var(--label2);display:grid;place-items:center;flex:none}
.ptile.def{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.pi{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.as .kinds{display:flex;gap:6px;padding:0 14px 12px}
.as .kinds button{flex:1;min-width:0;height:40px;border:0;border-radius:10px;background:var(--fill);color:var(--label2);display:grid;place-items:center}
.as .kinds button .pi{width:20px;height:20px}
.as .kinds button.sel{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cdot{width:10px;height:10px;border-radius:50%;flex:none}
.chv{flex:none;color:var(--chev-line);vertical-align:middle;margin-left:8px}
.chv-round{flex:none;color:var(--chev);vertical-align:middle}
.chv-bg{fill:var(--fill)}
/* 내역: 목록 / 달력 */
.sec-row{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.sec-row h2.sec{margin:0}
.txm{width:34px;height:34px;border:0;border-radius:12px;background:var(--fill);color:var(--label2);display:grid;place-items:center;padding:0}
.txm .pi{width:20px;height:20px}
.txm.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.cal{padding:12px 8px 8px}
.cal-wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;line-height:14px;color:var(--label3);margin-bottom:6px}
.cal-wk span:first-child{color:var(--red)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.cal-d{border:0;background:none;height:48px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;padding:4px 0 0;color:var(--label)}
.cal-d .n{font-size:14px;width:26px;height:26px;line-height:26px;border-radius:50%;text-align:center}
.cal-d .m{font-size:9.5px;line-height:12px;color:var(--label2);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cal-d .m.in{color:var(--green)}
.cal-d.today .n{background:var(--accent);color:#fff;font-weight:600}
.cal-d.sel{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.cal-d.future .n{color:var(--label3)}
.cal-empty{font-size:14px;color:var(--label2);text-align:center;padding:14px 0 24px}
h2.sec{font-size:22px;line-height:28px;font-weight:700;letter-spacing:.01em;margin:6px 0 12px}
.ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;flex:none}
.cell .t{flex:1;min-width:0;padding:11px 0;display:flex;flex-direction:column;gap:1px}
.cell .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:22px}
.cell .t small{font-size:13px;color:var(--label2);line-height:18px}
.cell .r{color:var(--label2);white-space:nowrap}
.cell .r.out{color:var(--label)}
.cell .r.in{color:var(--green)}
.empty{text-align:center;color:var(--label2);font-size:15px;padding:40px 16px}
.edit{border:0;background:none;color:var(--accent);font-size:13px;padding:0}
.cell .ck{color:var(--accent);flex:none}

/* ---------- action sheet ---------- */
/* 가운데 작은 팝업 */
.as{position:fixed;left:50%;top:calc((100% - var(--kb,0px)) / 2);width:min(320px,calc(100% - 48px));max-height:calc(100% - var(--kb,0px) - env(safe-area-inset-top,0px) - 40px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--pop);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-radius:22px;box-shadow:0 0 0 .5px var(--card-edge),0 16px 44px rgba(0,0,0,.16);
  transform:translate(-50%,-50%) scale(.94);opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.3,1.3,.5,1),opacity .18s,top .25s;z-index:3}
.as.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.as .g{background:none}
.as .h{text-align:left;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--label);padding:18px 52px 12px 18px;line-height:1.35}
.as .pop-x{position:absolute;right:12px;top:12px;width:28px;height:28px;border:0;border-radius:50%;background:var(--fill);color:var(--label2);display:grid;place-items:center;padding:0}
.as .pop-x svg{display:block}
.as .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px;justify-content:flex-start}
.as .chips button{border:0;background:var(--fill);border-radius:999px;padding:6px 11px;font-size:14px;display:flex;align-items:center;gap:6px}
.as .chips button.sel{background:var(--accent);color:#fff}
.as .chips i{width:7px;height:7px;border-radius:50%}
.as .sub{font-size:12px;color:var(--label2);padding:2px 18px 6px;text-align:left}
.as .fields{display:flex;flex-direction:column;gap:8px;padding:0 16px 12px}
.as .swatches{display:grid;grid-template-columns:repeat(6,30px);gap:12px 14px;justify-content:center;padding:4px 14px 16px}
.as .swatches button,.as .swatches label{width:30px;height:30px;border-radius:50%;border:0;padding:0;box-shadow:0 0 0 2px var(--pop);cursor:pointer;position:relative}
.as .swatches .sel{box-shadow:0 0 0 2px var(--pop),0 0 0 3.5px var(--label)}
.as .swatches label{background:conic-gradient(#f33,#ff3,#3f3,#3ff,#33f,#f3f,#f33)}
.as .swatches label i{position:absolute;inset:7px;border-radius:50%;background:var(--pop)}
.as .swatches label input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.as .fields textarea{border:0;background:var(--fill);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;outline:none;width:100%;min-height:68px;resize:vertical;color:inherit}
.as .day-row{display:flex;align-items:center;gap:8px;font-size:16px;padding:0 4px}
.as .fields .day-row input{width:64px;text-align:center}
.as .hint-line{font-size:12px;color:var(--label2);text-align:left;padding:0 18px 10px;min-height:1px}
/* 부가 동작(기본 지정·삭제 등): 작은 글자 버튼 */
/* 단축어 연결 안내 (단계별) */
.cell small .linked{color:var(--green);font-weight:600}
.gd-dots{display:flex;gap:5px;padding:0 18px 12px}
.gd-dots i{flex:1;height:4px;border-radius:2px;background:var(--fill);transition:background .25s}
.gd-dots i.on{background:var(--accent)}
.gd-step{padding:0 18px 4px}
.gd-step.inR{animation:gdR .32s cubic-bezier(.3,.8,.3,1)}.gd-step.inL{animation:gdL .32s cubic-bezier(.3,.8,.3,1)}
@keyframes gdR{from{opacity:0;transform:translateX(24px)}}@keyframes gdL{from{opacity:0;transform:translateX(-24px)}}
.gd-t{font-size:16px;font-weight:600;margin:14px 0 4px}
.gd-d{font-size:14px;line-height:1.45;color:var(--label2)}
.gd-open{display:block;margin:0 auto 14px;border:0;background:none;color:var(--accent);font-size:14px;padding:4px 8px}
.gs{background:var(--fill);border-radius:16px;padding:10px;height:200px;overflow:hidden;font-size:12px;display:flex;flex-direction:column;gap:5px;position:relative}
.gs-bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;min-height:24px;padding:0 2px 2px}
.gs-plus{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--accent);font-weight:500;font-size:16px}
.gs-next{color:var(--accent);font-weight:600;font-size:12px;padding:3px 8px;border-radius:8px}
.gs-row{display:flex;align-items:center;gap:8px;background:var(--cell);border-radius:9px;min-height:24px;padding:0 9px;color:var(--label)}
.gs-row em{margin-left:auto;font-style:normal;color:var(--label2)}
.gs-row em.ck{color:var(--accent);font-weight:700}
.gs-ic{display:grid;place-items:center;min-width:14px}
.gs-tile{display:block;width:14px;height:14px;border-radius:4px}
.gs-mono{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--accent);color:#fff;font-size:10px;font-weight:800}
.gs-empty{flex:1;display:grid;place-items:center;color:var(--label3);font-size:12px}
.gs-tabs{display:flex;justify-content:space-around;font-size:11px;color:var(--label2);padding-top:4px}
.gs-tabs .on{color:var(--accent);font-weight:600;padding:2px 8px;border-radius:8px}
.gs-search{background:var(--cell);border-radius:9px;height:26px;display:flex;align-items:center;padding:0 9px;color:var(--label)}
.gs-act{display:flex;gap:8px;align-items:center;background:var(--cell);border-radius:12px;padding:12px 10px;margin-top:6px;line-height:1.6}
.gs-tok{font-style:normal;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);border-radius:6px;padding:1px 6px;font-weight:600}
.gs .hl{box-shadow:0 0 0 2px var(--accent);animation:hl 1.6s ease-in-out infinite}
@keyframes hl{50%{box-shadow:0 0 0 2px var(--accent),0 0 0 6px color-mix(in srgb,var(--accent) 20%,transparent)}}
.as .guide{list-style:none;margin:0;padding:0 18px 14px;font-size:14px;line-height:1.45;color:var(--label);counter-reset:g;display:flex;flex-direction:column;gap:10px}
.as .guide li{display:flex;gap:10px;counter-increment:g}
.as .guide li::before{content:counter(g);flex:none;width:20px;height:20px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px}
/* 팝업 안의 켜기/끄기 줄 */
.as .sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 18px 14px;font-size:15px;color:var(--label);cursor:pointer}
.as .sw-row input{position:absolute;opacity:0;pointer-events:none}
.as .sw-row .tg{flex:none;width:46px;height:28px;border-radius:14px;background:var(--fill);position:relative;transition:background .2s}
.as .sw-row .tg::after{content:"";position:absolute;left:2px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.as .sw-row input:checked + .tg{background:var(--accent)}
.as .sw-row input:checked + .tg::after{transform:translateX(18px)}
.as .sw-row input:disabled + .tg{opacity:.5}
.as .sw-row input:focus-visible + .tg{outline:2px solid var(--accent);outline-offset:2px}
/* 결제 여러 건 한 번에 */
.as .pb-list{margin:0 16px 12px;background:var(--cell);border-radius:14px;overflow:hidden;max-height:min(46vh,340px);overflow-y:auto}
.as .pb-row{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;position:relative}
.as .pb-row + .pb-row::before{content:"";position:absolute;top:0;left:42px;right:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.as .pb-row input{position:absolute;opacity:0;pointer-events:none}
.as .pb-ck{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--label3);display:grid;place-items:center;transition:background .15s,box-shadow .15s}
.as .pb-row input:checked + .pb-ck{background:var(--accent);box-shadow:none}
.as .pb-row input:checked + .pb-ck::after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.as .pb-row input:focus-visible + .pb-ck{outline:2px solid var(--accent);outline-offset:2px}
.as .pb-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.as .pb-t b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as .pb-t small{font-size:12px;color:var(--label2)}
.as .pb-a{font-size:15px;font-weight:600;white-space:nowrap}
.as .pb-row:has(input:not(:checked)) .pb-t,.as .pb-row:has(input:not(:checked)) .pb-a{opacity:.4}
.as .pay-ask{font-size:15px;text-align:left;padding:0 18px 14px;color:var(--label2);line-height:1.4}
.as .pop-extra{display:flex;justify-content:flex-start;flex-wrap:wrap;gap:4px 18px;padding:0 18px 10px}
.as .pop-extra button{border:0;background:none;padding:4px 0;font-size:14px;color:var(--label2)}
.as .pop-extra button.red{color:var(--red);margin-left:auto} /* 삭제는 오른쪽 끝 */
/* 아래: 취소 | 저장 */
.as .pop-foot{display:flex;gap:8px;padding:4px 16px 16px}
.as .pop-foot:empty{display:none}
.as .pop-foot button{flex:1;height:44px;border:0;border-radius:14px;font-size:15px;font-weight:600;background:var(--fill);color:var(--label)}
.as .pop-foot .primary{background:var(--accent);color:#fff}
.as .pop-foot .primary.red{background:var(--red);color:#fff}
.as .pop-foot .danger-soft{background:var(--fill);color:var(--red);font-weight:500}
.as .fields input{border:0;background:var(--fill);border-radius:10px;height:42px;padding:0 12px;font-size:16px;outline:none;width:100%}
.bar .right{display:flex;gap:18px}
.inline{border:0;background:none;outline:none;font-size:17px;width:100%;padding:0}
.chev svg{transition:transform .2s}
.chev.open svg{transform:rotate(90deg)}
.toggle .t small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot-note a{color:var(--accent);text-decoration:none}
.foot-note{font-size:13px;color:var(--label2);padding:0 16px;margin:-16px 0 24px;line-height:18px}
.scrim2{z-index:2}
/* 내역을 올리면 로고가 작아지며 위쪽 가운데로 (흐린 막 위, 시트 아래) */
.fly-logo{position:fixed;left:0;top:0;height:auto;transform-origin:0 0;pointer-events:none;opacity:0;transition:transform .6s cubic-bezier(.3,1.5,.45,1)} /* 쫀득: 살짝 지나쳤다 돌아오는 스프링 */
.fly-logo.on{opacity:1}

.budget-in{width:100%;border:0;background:var(--fill);border-radius:12px;height:44px;padding:0 12px;font-size:17px;outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
